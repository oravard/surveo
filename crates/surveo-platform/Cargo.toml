[package]
name = "surveo-platform"
description = "Capacités propres à chaque système : capture d'écran, démarrage de session, dossiers (IMPL.md, « Capacités par plateforme »)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
log = "0.4"
fast_image_resize = "6"
jpeg-encoder = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"
x11rb = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
xcap = "0.9"
winreg = "0.55"
