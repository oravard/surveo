[package]
name = "surveo-console"
description = "Console Surveo de l'enseignant, avec relais intégré (SPEC.md, chap. 1, 9 ; RELAIS-1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "surveo_console"
path = "src/lib.rs"

[[bin]]
name = "surveo-console"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true
ts-rs.workspace = true
chrono.workspace = true
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
tauri.workspace = true
tauri-plugin-dialog = "2"
surveo-protocol = { workspace = true, features = ["ts"] }
surveo-identity.workspace = true
surveo-net.workspace = true
surveo-relay-core.workspace = true
surveo-platform.workspace = true

[dev-dependencies]
surveo-agent = { path = "../agent" }
tokio = { workspace = true, features = ["io-util"] }
