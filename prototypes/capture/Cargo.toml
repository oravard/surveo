[package]
name = "surveo-proto-capture"
version = "0.0.0"
edition = "2021"
publish = false
license = "EUPL-1.2"
description = "Prototype 2 de la phase 2 (IMPL.md) : capture d'écran et miniatures"

[dependencies]
anyhow = "1"
fast_image_resize = "6"
jpeg-encoder = "0.7"
cpu-time = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"
x11rb = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
xcap = "0.9"

[profile.release]
debug = false
