[package]
name = "surveo-proto-sans-admin"
version = "0.0.0"
edition = "2021"
publish = false
license = "EUPL-1.2"
description = "Prototype 3 de la phase 2 (IMPL.md) : installation, proxy utilisateur et filtrage sans droits d'administration"

[[bin]]
name = "sans-admin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Networking_WinInet", "Win32_System_Memory", "Win32_UI_Shell"] }

[profile.release]
debug = false
