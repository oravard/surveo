[package]
name = "surveo-proto-console"
version = "0.0.0"
edition = "2021"
publish = false
license = "EUPL-1.2"
description = "Prototype 4 de la phase 2 (IMPL.md) : console Tauri avec relais intégré"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
surveo-proto-relais = { path = "../../relais" }

[profile.release]
debug = false
