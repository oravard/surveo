[workspace]
resolver = "2"
members = ["crates/surveo-protocol", "crates/surveo-identity", "crates/surveo-net", "crates/surveo-relay-core", "crates/surveo-platform", "apps/agent", "apps/console"]
exclude = ["prototypes"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "EUPL-1.2"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
ts-rs = "11"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
surveo-protocol = { path = "crates/surveo-protocol" }
surveo-identity = { path = "crates/surveo-identity" }
surveo-net = { path = "crates/surveo-net" }
surveo-relay-core = { path = "crates/surveo-relay-core" }
surveo-platform = { path = "crates/surveo-platform" }

[profile.release]
debug = false
strip = true
