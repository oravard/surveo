<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Maquette validée le 29 octobre 2026 (SPEC.md, chapitre 9). Données fictives. Ouvrir directement dans un navigateur. -->
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Console Surveo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F6F8FA; --surface:#FFFFFF; --surface-2:#F0F3F6; --ink:#1F2328; --muted:#59636E; --line:#D1D9E0;
  --accent:#0969DA; --accent-soft:#DDF4FF; --accent-ink:#FFFFFF;
  --help:#9A6700; --help-soft:#FFF8C5;
  --late:#CF222E; --late-soft:#FFEBE9;
  --restrict:#8250DF; --restrict-soft:#FBEFFF;
  --ok:#1A7F37; --ok-soft:#DAFBE1;
  --bar:#24292F; --bar-2:#32383F; --bar-ink:#F0F6FC; --bar-muted:#9198A1;
  --demo:#7A5200; --demo-bg:#FFF6E2; --demo-line:#D9B25F;
  --shadow:0 1px 2px rgba(31,35,40,.07),0 6px 22px rgba(31,35,40,.07);
  --sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
  --tw:138px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1117; --surface:#161B22; --surface-2:#1C2128; --ink:#E6EDF3; --muted:#8B949E; --line:#30363D;
    --accent:#58A6FF; --accent-soft:#15243A; --accent-ink:#0D1117;
    --help:#D29922; --help-soft:#2E2412;
    --late:#F85149; --late-soft:#3A1D1F;
    --restrict:#BC8CFF; --restrict-soft:#2A2141;
    --ok:#3FB950; --ok-soft:#14301E;
    --bar:#21262D; --bar-2:#30363D; --bar-ink:#F0F6FC; --bar-muted:#8B949E;
    --demo:#F0C46A; --demo-bg:#2B2410; --demo-line:#6E5622;
    --shadow:0 1px 2px rgba(1,4,9,.4),0 6px 22px rgba(1,4,9,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1117; --surface:#161B22; --surface-2:#1C2128; --ink:#E6EDF3; --muted:#8B949E; --line:#30363D;
  --accent:#58A6FF; --accent-soft:#15243A; --accent-ink:#0D1117;
  --help:#D29922; --help-soft:#2E2412;
  --late:#F85149; --late-soft:#3A1D1F;
  --restrict:#BC8CFF; --restrict-soft:#2A2141;
  --ok:#3FB950; --ok-soft:#14301E;
  --bar:#21262D; --bar-2:#30363D; --bar-ink:#F0F6FC; --bar-muted:#8B949E;
  --demo:#F0C46A; --demo-bg:#2B2410; --demo-line:#6E5622;
  --shadow:0 1px 2px rgba(1,4,9,.4),0 6px 22px rgba(1,4,9,.35);
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:14px;height:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:10px 12px;gap:10px}

/* Barre de la maquette (hors produit) */
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:7px 12px;border:1.5px dashed var(--demo-line);background:var(--demo-bg);color:var(--demo);border-radius:10px;font-size:13px}
.demo b{letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
.demo .grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.demo label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.demo button{background:transparent;border:1px solid var(--demo-line);color:var(--demo);border-radius:7px;padding:3px 8px;cursor:pointer;font-size:13px}
.demo button:hover{background:color-mix(in srgb,var(--demo-line) 22%,transparent)}

/* Application */
.app{flex:1;min-height:0;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;letter-spacing:.01em}
.brand .mark{width:22px;height:22px;border-radius:6px;background:var(--accent);position:relative}
.brand .mark::after{content:"";position:absolute;inset:6px 6px 9px 6px;border:2px solid var(--accent-ink);border-radius:2px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seance{display:flex;align-items:center;gap:8px;font-size:14px;padding-left:10px;border-left:1px solid var(--line)}
.seance .room{font-weight:700}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 45%,var(--line))}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--surface-2)}
.search{min-width:220px;justify-content:space-between;color:var(--muted);font-weight:400}
.bell{position:relative}
.bell .dot{position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--muted);border:2px solid var(--surface)}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.who b{color:var(--ink)}

/* Bandeaux */
.topbar{grid-row:1}
.banners{grid-row:2;display:flex;flex-direction:column;gap:6px}
#mainwrap > *{grid-row:3;min-height:0}
.actionbar{grid-row:4}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:7px 12px;border-radius:10px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.banner .ic{color:var(--muted)}
.banner.exam{background:var(--restrict-soft);border-color:color-mix(in srgb,var(--restrict) 40%,transparent)}
.banner.exam .ic{color:var(--restrict)}
.banner.proj{background:var(--bar);color:var(--bar-ink);border-color:var(--bar)}
.banner.proj .ic{color:var(--bar-ink)}
.banner.proj .btn{background:var(--bar-2);color:var(--bar-ink);border-color:var(--bar-2)}
.banner .grow{flex:1}

/* Zone principale */
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px}
.stage{min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative}
.stage-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.stage-head .hint{font-size:13px;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;color:var(--muted)}
.switch input{appearance:none;width:32px;height:18px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:16px}
.stage-body{flex:1;min-height:0;overflow:auto;padding:14px}

/* Plan de salle */
.front{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;width:max-content;min-width:100%}
.board{flex:1;max-width:520px;margin-inline:auto;text-align:center;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid var(--line);padding-bottom:4px}
.desk{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface-2);white-space:nowrap}
.plan{display:grid;grid-template-columns:repeat(3,var(--tw)) 34px repeat(3,var(--tw));gap:12px;width:max-content;margin-inline:auto}
.aisle{grid-column:4;font-size:10.5px;color:var(--muted);writing-mode:vertical-rl;text-align:center;letter-spacing:.12em;text-transform:uppercase;align-self:center}
.tile{min-height:100px;display:flex;flex-direction:column;gap:5px;padding:8px 9px;border-radius:9px;background:var(--surface);border:1px solid var(--line);text-align:left;cursor:pointer;position:relative;transition:border-color .12s}
.tile:hover{border-color:var(--muted)}
.tile.sel{outline:2.5px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
.tile.help{box-shadow:inset 4px 0 0 var(--help)}
.tile.paused{background:repeating-linear-gradient(135deg,var(--restrict-soft) 0 7px,var(--surface) 7px 14px)}
.tile.sel.paused{background:repeating-linear-gradient(135deg,var(--restrict-soft) 0 7px,var(--accent-soft) 7px 14px)}
.tile.st-off{background:transparent;border-style:dashed;color:var(--muted)}
.tile.st-on{background:var(--surface-2);color:var(--muted)}
.tile.st-lost{border-color:color-mix(in srgb,var(--late) 50%,var(--line))}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:4px}
.t-num{font-family:var(--mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.t-flags{display:flex;gap:3px}
.flag{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:1px 5px;border-radius:99px;line-height:1.3}
.flag.help{background:var(--help-soft);color:var(--help)}
.flag.late{background:var(--late-soft);color:var(--late)}
.flag.pause{background:var(--restrict-soft);color:var(--restrict)}
.flag.game{background:var(--surface-2);color:var(--muted);border:1px dashed var(--muted)}
.flag.lost{background:var(--late-soft);color:var(--late)}
.t-names{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-off .t-names,.st-on .t-names{font-weight:400}
.t-steps{display:flex;gap:3px}
.t-steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.t-steps i.done{background:var(--ok)}
.t-steps i.cur{background:var(--accent)}
.t-foot{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted)}
.t-state{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.t-check{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;align-items:center;justify-content:center}
.tile.sel .t-check{display:flex}
.t-check .ic{width:13px;height:13px;stroke-width:2.6}
.ident-num{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:var(--mono);font-size:44px;font-weight:600;background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:9px;color:var(--accent)}
.tile.ident .ident-num{display:flex}
.slot{min-height:100px;border:1.5px dashed var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);background:transparent;cursor:default}
.placing .slot{border-color:var(--accent);color:var(--accent);cursor:pointer;background:var(--accent-soft)}
.unplaced{margin-top:18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:10px;font-size:14px;width:max-content;max-width:100%;margin-inline:auto}

/* Écrans factices */
.fs{border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,.18);background:#fff;display:flex;flex-direction:column;aspect-ratio:16/10;max-width:100%;font-family:var(--sans)}
.fs .tb{height:13%;min-height:7px;background:#dfe3e8;display:flex;align-items:center;padding-inline:4%;font-size:clamp(5px,1.3cqw,11px);color:#333;white-space:nowrap;overflow:hidden}
.fs .bd{flex:1;position:relative;padding:5%;display:flex;flex-direction:column;gap:6%}
.fs .ln{height:5%;min-height:2px;border-radius:2px;background:#c9ced6}
.fs-writer .bd{background:#e9ebee}
.fs-writer .pg{background:#fff;flex:1;padding:6% 8%;display:flex;flex-direction:column;gap:9%;box-shadow:0 0 0 1px #d6d9de}
.fs-term .bd{background:#1d1f21}
.fs-term .ln{background:#3d7d3d}
.fs-term .ln.w{background:#8c8f91}
.fs-browser .addr{height:9%;background:#eef0f3;border-radius:3px;margin-bottom:3%}
.fs-browser .blk{background:#d8dde6;border-radius:3px}
.fs-pt .bd{background:#f1f4f8}
.fs-pt .node{position:absolute;width:12%;aspect-ratio:1;border-radius:3px;background:#3b78c6}
.fs-pt .node.r{background:#c66a3b;border-radius:50%}
.fs-pt .wire{position:absolute;height:1.5px;background:#555;transform-origin:left center}
.fs-wire .bd{background:#fff;gap:3%}
.fs-wire .ln{height:7%;background:#e6eefb}
.fs-wire .ln:nth-child(3n){background:#e8f7e5}
.fs-game .bd{background:linear-gradient(#7fb7f0 0 55%,#5c9e3f 55%)}
.masked{aspect-ratio:16/10;border-radius:5px;border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px;text-align:center;padding:6px;background:var(--surface-2)}
.tile .fs,.tile .masked{container-type:inline-size}

/* Liste */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.sel td{background:var(--accent-soft)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.sel:hover td{background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.in{background:var(--ok-soft);color:var(--ok)}
.pill.lost{background:var(--late-soft);color:var(--late)}

/* Mosaïque */
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:7px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.mcard.sel{outline:2.5px solid var(--accent);outline-offset:1px}
.mcard .fs,.mcard .masked{container-type:inline-size}
.mcard .cap{display:flex;justify-content:space-between;gap:6px;font-size:13px}
.mcard .cap span:last-child{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Focus */
.focus{position:absolute;inset:0;background:var(--surface);border-radius:12px;display:flex;flex-direction:column;z-index:5}
.focus-body{flex:1;min-height:0;overflow:auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}
.focus-body .fs,.focus-body .masked{container-type:inline-size}
.focus-side{display:flex;flex-direction:column;gap:12px;font-size:14px}
.focus-side h3{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.applist{display:flex;flex-direction:column;gap:6px}
.applist div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}

/* Panneau */
.panel{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.psec{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.psec > button.ph{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border:0;background:transparent;cursor:pointer;font-weight:700;font-size:14.5px;text-align:left}
.ph .count{margin-left:auto;font-family:var(--mono);font-size:12.5px;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.ph .count.hot{background:var(--help-soft);color:var(--help)}
.ph .chev{transition:transform .15s;color:var(--muted)}
.psec.collapsed .chev{transform:rotate(-90deg)}
.pb{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.psec.collapsed .pb{display:none}
.hq{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:9px}
.hq .ord{font-family:var(--mono);font-weight:600;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--help-soft);color:var(--help);font-size:12px;flex:none}
.hq .txt{flex:1;min-width:0}
.hq .txt small{display:block;color:var(--muted);font-size:12px}
.stepbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 8px;font-size:13px}
.stepbar .lbl{color:var(--muted);font-family:var(--mono);font-size:12px}
.stepbar .track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.stepbar .fill{height:100%;background:var(--accent)}
.stepbar .n{font-family:var(--mono);font-size:12.5px;text-align:right}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv span{font-size:12.5px;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.kv span.late{background:var(--late-soft);color:var(--late);border-color:transparent}
.pollbar{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:13px}
.pollbar .track{grid-column:1/-1;height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.pollbar .fill{height:100%;background:var(--ok)}
.conv{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:transparent;text-align:left;width:100%}
.conv:hover{border-color:var(--muted)}
.conv .who2{font-weight:700;font-size:13.5px}
.conv .prev{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.conv .unr{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.thread{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:90%;padding:6px 9px;border-radius:10px;font-size:13.5px;background:var(--surface-2);border:1px solid var(--line)}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.bubble small{display:block;font-size:11px;color:var(--muted)}
.inrow{display:flex;gap:6px}
.inrow input,.field,textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
textarea{width:100%;resize:vertical;min-height:64px}
.hidden-msg{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:8px;border:1px dashed var(--line);border-radius:8px}

/* Barre d'actions */
.actionbar{position:relative;background:var(--bar);color:var(--bar-ink);border-radius:12px;padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;box-shadow:var(--shadow)}
.target{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:14px;min-width:0}
.target .note{font-size:13px;color:var(--bar-muted)}

.actions{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.bbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:8px;border:1px solid transparent;background:var(--bar-2);color:var(--bar-ink);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}

.pop{position:absolute;bottom:calc(100% + 8px);right:10px;width:min(420px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.22);padding:12px;display:flex;flex-direction:column;gap:10px;z-index:30;max-height:min(70vh,560px);overflow:auto}
.pop h3{margin:0;font-size:15px}
.pop .sub{font-size:13px;color:var(--muted);margin:0}
.pop .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.opt:hover{border-color:var(--muted)}
.opt .ic{color:var(--muted)}

.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:4px 10px;font-size:13px;cursor:pointer;text-align:left}

/* Toasts */
.toasts{position:fixed;right:16px;bottom:96px;display:flex;flex-direction:column;gap:8px;z-index:40;max-width:min(440px,calc(100vw - 32px))}
.toast{background:var(--bar);color:var(--bar-ink);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:flex-start;gap:10px;font-size:14px}
.toast .ic{color:#3FB950;margin-top:1px}
.toast .tx{flex:1}
.toast small{display:block;color:var(--bar-muted);font-size:12.5px;margin-top:2px}
.toast button{background:transparent;border:1px solid var(--bar-muted);color:var(--bar-ink);border-radius:7px;padding:3px 9px;cursor:pointer;font-weight:700;font-size:13px}

/* Dialogue et palette */
.backdrop{position:fixed;inset:0;background:rgba(1,4,9,.55);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;z-index:60}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(460px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.dialog h2{margin:0;font-size:18px;text-wrap:balance}

.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.palette input:focus{outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14.5px}
.palette li .grp{margin-left:auto;font-size:12px;color:var(--muted)}
.palette li[aria-selected="true"]{background:var(--accent-soft)}

.space{min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:grid;grid-template-columns:230px minmax(0,1fr)}
.space nav{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:3px}

.space .content{padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--surface);text-align:left}

.card h3{margin:0;font-size:15.5px}

.steps{display:flex;flex-direction:column;gap:6px}

.spanel header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.spanel .sb{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px;font-size:14px}
.spanel h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sstep{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.sstep input{margin-top:3px;accent-color:var(--ok);width:16px;height:16px}
.sstep.cur{font-weight:700}
.consigne{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13.5px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:12px;text-align:center;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.ack{font-size:13px;color:var(--ok);display:flex;gap:6px;align-items:center}
.overlay{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay.pause{background:#151a2b;color:#e8ecff;flex-direction:column;gap:10px;text-align:center}
.overlay.pause .big{font-size:26px;font-weight:700}
.fg{background:rgba(5,10,15,.35)}
.fgcard{background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(420px,100%);padding:18px;display:flex;flex-direction:column;gap:10px}
.fgcard h3{margin:0;font-size:16px}
.castwin{position:absolute;left:8%;top:12%;width:min(56%,640px);background:var(--surface);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.45);z-index:7;overflow:hidden}
.castwin header{padding:8px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.castwin .fs{border-radius:0;border:0;container-type:inline-size}

/* Renvois à la spécification (maquette) */
.ref{display:none;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--demo);background:var(--demo-bg);border:1px dashed var(--demo-line);border-radius:5px;padding:0 4px;vertical-align:middle;white-space:nowrap}
.show-refs .ref{display:inline-block}

@media (max-width: 980px){

}

/* ---------- Cibles et retours ---------- */
function targets(){
  const explicit = S.sel.size > 0;
  const base = explicit ? [...S.sel].map(P) : placed();
  return { explicit, base,
    ok: base.filter(p => p.state==='in'),
    pending: base.filter(p => p.state==='lost'),
    na: base.filter(p => p.state==='off' || p.state==='on') };
}
function retour(verb, t){
  let s = `${verb} ${plural(t.ok.length,'poste')}`;
  if(t.pending.length) s += ` · ${t.pending.length} en attente (${t.pending.map(p=>'poste '+p.label).join(', ')}, connexion perdue)`;
  return s;
}
function naNote(t){
  if(!t.explicit || !t.na.length) return '';
  const why = t.na.map(p => `poste ${p.label} ${p.state==='off'?'est éteint':'n’a pas rejoint la séance'}`).join(', ');
  return `S'applique à ${t.ok.length+t.pending.length} poste${t.ok.length+t.pending.length>1?'s':''} sur ${t.base.length} : ${why}.`;
}

/* ---------- Toasts ---------- */
function toast(text, detail='', undo=null, refs=''){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${ic('check')}<div class="tx">${esc(text)} ${refs?ref(refs):''}${detail?`<small>${esc(detail)}</small>`:''}</div>${undo?`<button type="button">${'Annuler'}</button>`:''}`;
  if(undo) el.querySelector('button').onclick = () => { undo(); el.remove(); render(); toast('Action annulée.'); };
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), undo ? 8000 : 5500);
}

/* ---------- Dialogue ---------- */
function dialog({title, body, ok, danger=false, onOk, cancel='Annuler'}){
  const layer = $('#layer');
  layer.innerHTML = `<div class="backdrop" data-close><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <h2 id="dlgT">${esc(title)}</h2>${body}
    <div class="row"><button type="button" class="btn" data-close>${esc(cancel)}</button>${ok?`<button type="button" class="btn ${danger?'danger':'primary'}" id="dlgOk">${esc(ok)}</button>`:''}</div></div></div>`;
  layer.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', e => { if(e.target===b) layer.innerHTML=''; }));
  const okb = $('#dlgOk'); if(okb){ okb.onclick = () => { layer.innerHTML=''; onOk(); }; okb.focus(); }
}

/* ---------- Actions ---------- */
function allPaused(){ const t = targets(); const l = [...t.ok, ...t.pending]; return l.length && l.every(p => p.paused); }
function actPause(){
  const t = targets(); const l = [...t.ok, ...t.pending];
  if(!l.length){ toast('Aucun poste de la sélection n’est dans la séance.'); return; }
  const prev = l.map(p => [p, p.paused]);
  const resume = allPaused();
  l.forEach(p => p.paused = !resume);
  render();
  toast(retour(resume ? 'Écran repris sur' : 'Écran mis en pause sur', t), resume ? '' : 'Message affiché : « Écran mis en pause par M. Durand. »', () => prev.forEach(([p,v]) => p.paused = v), 'RETOUR-1 RETOUR-3');
}
function actExam(){
  const was = S.exam; S.exam = !S.exam; S.pop = null;
  if(S.exam && !S.web) S.web = 'examallow';

}

function launchTP(i){

let pollTimer = null;
function launchPoll(i){
  const t = targets();
  const who = [...t.ok].map(p => p.id);
  S.poll = {q:POLLS[i].q, opts:POLLS[i].opts, votes:POLLS[i].opts.map(()=>0), who, answered:new Set(), shown:false, open:true};
  S.student.pollAnswered = false;
  S.pop = null; render();
  toast(retour('Sondage lancé sur', t), `« ${POLLS[i].q} »`, null, 'SONDAGE-2');
  clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if(!S.poll || !S.poll.open){ clearInterval(pollTimer); return; }
    const left = S.poll.who.filter(id => id!==7 && !S.poll.answered.has(id));
    if(left.length <= 2){ clearInterval(pollTimer); return; }
    const id = left[Math.floor(Math.random()*left.length)];
    S.poll.answered.add(id);
    const w = [5,3,2]; const r = Math.random()*10; S.poll.votes[r < w[0] ? 0 : r < w[0]+w[1] ? 1 : 2]++;
    renderPanel(); if(S.studentView) renderStudent();
  }, 700);
}

  const helpIdx = S.helpQueue.indexOf(p.id);
  const flags = [];
  if(helpIdx >= 0) flags.push(`<span class="flag help" title="Demande d'aide, rang ${helpIdx+1}">${ic('hand','sm')}${helpIdx+1}</span>`);
  if(p.late && p.state==='in') flags.push(`<span class="flag late" title="En retard sur l'étape">${ic('clock','sm')}</span>`);
  if(p.paused) flags.push(`<span class="flag pause" title="Écran en pause">${ic('pause','sm')}</span>`);
  if(p.game && p.state==='in') flags.push(`<span class="flag game" title="Activité de jeu probable (indication, pas une preuve)">${ic('game','sm')}?</span>`);
  if(p.state==='lost') flags.push(`<span class="flag lost" title="Connexion perdue">${ic('wifioff','sm')}</span>`);
  const steps = tp().steps.length;
  const cls = ['tile','st-'+p.state, S.sel.has(p.id)?'sel':'', helpIdx>=0?'help':'', p.paused?'paused':''].join(' ');
  let body;
  if(p.state==='off') body = `<span class="t-names">—</span><span class="t-state">${ic('power','sm')}Éteint</span>`;
  else if(p.state==='on') body = `<span class="t-names">${p.host?esc(p.host):'—'}</span><span class="t-state">${ic('power','sm')}Allumé · hors séance</span>`;
  else {
    const seg = Array.from({length:steps}, (_,i) => `<i class="${i<p.step?'done':i===p.step?'cur':''}"></i>`).join('');
    body = `<span class="t-names">${esc(p.names.join(' · ') || 'Sans nom')}</span>
      ${S.showScreens ? (S.projection ? masked() : screen(p)) : ''}
      <span class="t-steps" aria-hidden="true">${seg}</span>
      <span class="t-foot"><span>Étape ${p.step+1}/${steps}</span><span>Rendus ${p.rendus}/${tp().rendus}</span></span>
      ${p.state==='lost' ? `<span class="t-state" style="color:var(--late)">${ic('wifioff','sm')}Connexion perdue</span>` : ''}`;
  }
  const label = `Poste ${p.label}, ${p.state==='off'?'éteint':p.state==='on'?'allumé hors séance':p.state==='lost'?'connexion perdue':'dans la séance'}${p.names.length?', '+p.names.join(' et '):''}`;
  return `<button type="button" class="${cls}" data-id="${p.id}" aria-pressed="${S.sel.has(p.id)}" aria-label="${esc(label)}" style="grid-row:${p.pos.r+1};grid-column:${p.pos.c<3?p.pos.c+1:p.pos.c+2}">
    <span class="t-head"><span class="t-num">${p.label}</span><span class="t-flags">${flags.join('')}</span></span>${body}
    <span class="t-check" aria-hidden="true">${ic('check')}</span><span class="ident-num" aria-hidden="true">${p.label}</span></button>`;
}
function planHTML(){
  const tiles = placed().map(tileHTML).join('');
  const free = FREE.filter(f => !placed().some(p => p.pos.r===f.r && p.pos.c===f.c));
  const slots = free.map(f => `<button type="button" class="slot" data-slot="${f.r},${f.c}" style="grid-row:${f.r+1};grid-column:${f.c+1}" ${S.placing?'':'tabindex="-1"'}>${S.placing?'Placer ici':'Place libre'}</button>`).join('');
  const un = S.postes.filter(p => !p.pos);
  return `<div class="front"><span class="desk">Bureau enseignant</span><div class="board">Tableau · vidéoprojecteur</div><span class="desk" style="visibility:hidden">Bureau enseignant</span></div>
    <div class="plan ${S.placing?'placing':''}">${tiles}${slots}<div class="aisle" style="grid-row:1/5">Allée</div></div>
    ${un.length ? `<div class="unplaced">${ic('plus','sm')}<span><b>${un.length} poste à placer</b> · ${esc(un[0].host)} ${ref('SALLE-3')}</span>
      <button type="button" class="btn" id="identNew">${ic('target','sm')}Identifier</button>
      <button type="button" class="btn ${S.placing?'':'primary'}" id="placeNew">${S.placing?'Annuler':'Placer sur le plan'}</button>
      ${S.placing?'<span class="note">Cliquez une place libre sur le plan.</span>':''}</div>` : ''}`;
}
function listRows(){
  let l = placed();
  if(S.listFilter==='norendu') l = l.filter(p => (p.state==='in'||p.state==='lost') && p.rendus < tp().rendus);
  if(S.listFilter==='late') l = l.filter(p => p.late && p.state==='in');
  if(S.listFilter==='help') l = l.filter(p => S.helpQueue.includes(p.id));
  return l;
}
function listHTML(){
  const rows = listRows();
  const f = [['all','Tous'],['norendu','N’ont pas tout rendu'],['late','En retard'],['help','Demande d’aide']];
  const st = p => p.state==='in' ? `<span class="pill in">${ic('check','sm')}Dans la séance</span>` : p.state==='lost' ? `<span class="pill lost">${ic('wifioff','sm')}Connexion perdue</span>` : p.state==='on' ? `<span class="pill">${ic('power','sm')}Hors séance</span>` : `<span class="pill">${ic('power','sm')}Éteint</span>`;
  return `<div class="filters">${f.map(([k,l]) => `<button type="button" class="chip" data-f="${k}" aria-pressed="${S.listFilter===k}">${l}</button>`).join('')}
    ${S.listFilter!=='all' && rows.length ? `<button type="button" class="btn primary" id="selRows">Sélectionner ces ${rows.length} postes</button>${ref('SEL-1')}` : ''}</div>
    <div class="tablewrap"><table><thead><tr><th>Poste</th><th>Élèves</th><th>État</th><th>Étape</th><th>Rendus</th><th>Signaux</th></tr></thead><tbody>
    ${rows.map(p => { const hi = S.helpQueue.indexOf(p.id); return `<tr data-id="${p.id}" class="${S.sel.has(p.id)?'sel':''}" tabindex="0" aria-selected="${S.sel.has(p.id)}">
      <td class="mono"><b>${p.label}</b></td><td>${esc(p.names.join(', ')||'—')}</td><td>${st(p)}</td>
      <td>${p.state==='in'||p.state==='lost' ? `${p.step+1}/${tp().steps.length} · ${esc(tp().steps[p.step].o)}` : '—'}</td>
      <td class="mono">${p.state==='in'||p.state==='lost' ? `${p.rendus}/${tp().rendus}` : '—'}</td>
      <td><span class="t-flags">${hi>=0?`<span class="flag help">${ic('hand','sm')}${hi+1}</span>`:''}${p.late&&p.state==='in'?`<span class="flag late">${ic('clock','sm')}Retard</span>`:''}${p.paused?`<span class="flag pause">${ic('pause','sm')}Pause</span>`:''}${p.game&&p.state==='in'?`<span class="flag game">${ic('game','sm')}Jeu ?</span>`:''}</span></td></tr>`; }).join('')}
    </tbody></table></div>${rows.length?'':'<p class="note">Aucun poste ne correspond à ce filtre.</p>'}`;
}
function mosaicHTML(){

  return `<div class="mosaic">${l.map(p => `<button type="button" class="mcard ${S.sel.has(p.id)?'sel':''}" data-id="${p.id}" aria-pressed="${S.sel.has(p.id)}">
    ${S.projection ? masked() : p.state==='lost' ? `<div class="masked">${ic('wifioff')}<span>Connexion perdue</span></div>` : screen(p)}
    <span class="cap"><b class="mono">${p.label}</b><span>${esc(p.names.join(', ')||'Sans nom')}</span></span></button>`).join('')}</div>${S.projection?`<p class="note" style="margin-top:10px">${ref('PROJ-2')} En mode projection, les écrans ne s'affichent pas.</p>`:''}`;
}
function focusHTML(){

    <div class="stage-head"><b>Poste ${p.label}</b><span>${esc(p.names.join(', ')||'Sans nom')}</span><span class="spacer" style="flex:1"></span><button type="button" class="btn" id="focusClose">${ic('x','sm')}Revenir à la salle</button></div>

        <div class="toolbar"><button type="button" class="btn" id="fConv">${ic('msg','sm')}Conversation</button><button type="button" class="btn" id="fIdent">${ic('target','sm')}Identifier</button></div>

    ${lost.map(p => `<li>Poste ${p.label} : injoignable, remise en état à son prochain démarrage ou à ${fmt(S.end+10)}.</li>`).join('')}
    <li>Rendus conservés : ${placed().reduce((s,p)=>s+p.rendus,0)} fichiers, rangés par séance, TP et élèves.</li></ul>

function bindStage(){
  const body = $('#stageBody'); if(!body) return;
  body.querySelectorAll('.tile, .mcard').forEach(el => {
    el.addEventListener('click', () => {
      const id = +el.dataset.id;
      if(S.sel.has(id)) S.sel.delete(id); else S.sel.add(id);
      S.pop = null; render();
    });
    el.addEventListener('dblclick', () => { const p = P(+el.dataset.id); if(p.state==='in'){ S.focus = p.id; S.sel = new Set([p.id]); render(); } });
  });
  body.querySelectorAll('tbody tr').forEach(tr => {
    const tg = () => { const id = +tr.dataset.id; if(S.sel.has(id)) S.sel.delete(id); else S.sel.add(id); render(); };
    tr.addEventListener('click', tg);
    tr.addEventListener('keydown', e => { if(e.key===' '||e.key==='Enter'){ e.preventDefault(); tg(); } });
  });
  body.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.listFilter = b.dataset.f; render(); });
  const sr = $('#selRows'); if(sr) sr.onclick = () => { S.sel = new Set(listRows().map(p => p.id)); render(); };
  const pn = $('#placeNew'); if(pn) pn.onclick = () => { S.placing = !S.placing; render(); };
  const idn = $('#identNew'); if(idn) idn.onclick = () => toast('Numéro 25 affiché sur l’écran de PC-B204-25 pendant 4 s', 'Repérez-le dans la salle pour le placer.', null, 'SALLE-4');
  body.querySelectorAll('[data-slot]').forEach(s => s.onclick = () => {
    if(!S.placing) return;
    const [r,c] = s.dataset.slot.split(',').map(Number);
    const p = P(25); p.pos = {r,c}; p.state = 'in'; p.names = []; p.step = 0;
    S.placing = false; render();
    toast('Poste 25 placé sur le plan de B204', 'Il garde cette place pour les séances suivantes, quel que soit l’enseignant.', null, 'SALLE-2 SALLE-3');
  });
  const fc = $('#focusClose'); if(fc) fc.onclick = () => { S.focus = null; render(); };
  document.querySelectorAll('[data-close-app]').forEach(b => b.onclick = () => closeApp(P(S.focus), b.dataset.closeApp));
  const fcv = $('#fConv'); if(fcv) fcv.onclick = () => { S.openConv = S.focus; S.unread.delete(S.focus); S.collapsed.conv=false; S.focus=null; render(); };
  const fid = $('#fIdent'); if(fid) fid.onclick = () => toast(`Numéro ${P(S.focus).label} affiché sur l'écran du poste pendant 4 s`, '', null, 'SALLE-4');
}

/* ---------- Panneau ---------- */
function psec(key, icon, title, count, hot, body){
  const c = !!S.collapsed[key];
  return `<section class="psec ${c?'collapsed':''}"><button type="button" class="ph" data-col="${key}" aria-expanded="${!c}">${ic(icon,'sm')}${title}<span class="count ${hot?'hot':''}">${count}</span>${ic('chev','sm chev')}</button><div class="pb">${body}</div></section>`;
}
function renderPanel(){
  const el = $('#panel'); if(!el) return;
  const out = [];
  // Demandes d'aide
  const hq = S.helpQueue.map((id,i) => { const p = P(id); return `<div class="hq"><span class="ord">${i+1}</span><span class="txt"><b>Poste ${p.label}</b> · ${esc(p.names.join(', ')||'sans nom')}<small>il y a ${4+i*3} min</small></span><button type="button" class="btn" data-done="${id}">Traité</button></div>`; }).join('');
  out.push(psec('aide','hand',"Demandes d'aide", S.helpQueue.length, S.helpQueue.length>0, (hq || '<p class="note" style="margin:0">Aucune demande en attente.</p>') + ref('AIDE-2 PANNEAU-1')));
  // TP
  const inS = placed().filter(p => p.state==='in' || p.state==='lost');
  const steps = tp().steps.map((s,i) => { const n = inS.filter(p => p.step===i).length; return `<span class="lbl">${i+1}</span><span class="track"><span class="fill" style="width:${inS.length? n/inS.length*100:0}%;display:block"></span></span><span class="n">${n}</span><span></span><span style="grid-column:2/4;font-size:12.5px;color:var(--muted);margin-top:-2px">${esc(s.o)}</span>`; }).join('');
  const late = inS.filter(p => p.late).length;
  const full = inS.filter(p => p.rendus >= tp().rendus).length;
  out.push(psec('tp','list',`TP « ${esc(tp().title)} »`, `${inS.length} postes`, false, `<div class="stepbar">${steps}</div><div class="kv"><span>Rendus complets : ${full}/${inS.length}</span>${late?`<span class="late">${late} en retard</span>`:''}</div>
    <div class="toolbar"><button type="button" class="btn" id="tpList">Voir en liste</button>${late?`<button type="button" class="btn" id="tpLate">Sélectionner les postes en retard</button>`:''}</div>`));
  // Sondage
  if(S.poll){
    const tot = S.poll.votes.reduce((a,b)=>a+b,0);
    const bars = S.poll.opts.map((o,i) => `<span>${esc(o)}</span><span class="mono">${S.poll.votes[i]}</span><span class="track"><span class="fill" style="display:block;width:${tot?S.poll.votes[i]/tot*100:0}%"></span></span>`).join('');
    out.push(psec('poll','poll','Sondage', `${tot}/${S.poll.who.length}`, false, `<b>${esc(S.poll.q)}</b><div class="pollbar">${bars}</div>
      <div class="toolbar">${S.poll.open?`<button type="button" class="btn" id="pollClose">Clore le sondage</button>`:'<span class="note">Sondage clos.</span>'}<button type="button" class="btn" id="pollShow" aria-pressed="${S.poll.shown}">${S.poll.shown?'Résultats montrés':'Montrer aux élèves'}</button></div>
      ${S.poll.shown?`<p class="note" style="margin:0">Les élèves voient les résultats agrégés, sans aucun nom. ${ref('SONDAGE-5')}</p>`:''}`));
  }
  // Conversations
  let cv;
  if(S.openConv){
    const p = P(S.openConv), th = S.convs[S.openConv] || [];
    cv = `<button type="button" class="btn ghost" id="convBack" style="align-self:flex-start">← Toutes les conversations</button><b>Poste ${p.label} · ${esc(p.names.join(', ')||'sans nom')}</b>
      ${S.projection ? `<div class="hidden-msg">${ic('eyeoff','sm')}Contenu masqué en mode projection ${ref('PROJ-2')}</div>` : `<div class="thread">${th.map(m => `<div class="bubble ${m.me?'me':''}">${esc(m.x)}<small>${m.me?TEACHER:esc(p.names[0]||'Élève')} · ${m.t}</small></div>`).join('')||'<p class="note" style="margin:0">Pas encore de message.</p>'}</div>
      <form class="inrow" id="convForm"><input id="convIn" aria-label="Votre message" placeholder="Écrire au poste ${p.label}…" autocomplete="off"><button class="btn primary" type="submit">Envoyer</button></form>`}`;
  } else {
    const ids = Object.keys(S.convs).map(Number);
    cv = ids.map(id => { const p = P(id), last = S.convs[id][S.convs[id].length-1]; return `<button type="button" class="conv" data-conv="${id}">${S.unread.has(id)?'<span class="unr" aria-label="non lu"></span>':''}<span style="flex:1;min-width:0"><span class="who2">Poste ${p.label} · ${esc(p.names.join(', '))}</span><span class="prev">${S.projection?'Contenu masqué en mode projection':esc(last.x)}</span></span></button>`; }).join('') + `<p class="note" style="margin:0">Chaque poste a une conversation privée avec vous. ${ref('CHAT-1 CHAT-2')}</p>`;
  }
  out.push(psec('conv','msg','Conversations', S.unread.size ? `${S.unread.size} non lu` : Object.keys(S.convs).length, S.unread.size>0, cv));
  el.innerHTML = out.join('');
  el.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { S.collapsed[b.dataset.col] = !S.collapsed[b.dataset.col]; renderPanel(); });
  el.querySelectorAll('[data-done]').forEach(b => b.onclick = () => { const id = +b.dataset.done; S.helpQueue = S.helpQueue.filter(x => x!==id); if(id===7) S.student.helpTaken = true; render(); toast(`Demande du poste ${P(id).label} marquée comme traitée`, 'L’élève voit que sa demande a été prise en compte.', null, 'AIDE-3 AIDE-4'); });
  const tl = $('#tpList'); if(tl) tl.onclick = () => { S.view='liste'; S.listFilter='all'; render(); };
  const tla = $('#tpLate'); if(tla) tla.onclick = () => { S.sel = new Set(inS.filter(p=>p.late).map(p=>p.id)); render(); };
  const pc = $('#pollClose'); if(pc) pc.onclick = () => { S.poll.open = false; render(); toast('Sondage clos', 'La question disparaît chez les élèves.', null, 'SONDAGE-4'); };
  const ps = $('#pollShow'); if(ps) ps.onclick = () => { S.poll.shown = !S.poll.shown; renderPanel(); };
  el.querySelectorAll('[data-conv]').forEach(b => b.onclick = () => { S.openConv = +b.dataset.conv; S.unread.delete(S.openConv); render(); });
  const cb = $('#convBack'); if(cb) cb.onclick = () => { S.openConv = null; renderPanel(); };
  const cf = $('#convForm'); if(cf) cf.onsubmit = e => { e.preventDefault(); const v = $('#convIn').value.trim(); if(!v) return; (S.convs[S.openConv] = S.convs[S.openConv]||[]).push({me:true,t:fmt(S.now),x:v}); renderPanel(); $('#convIn').focus(); };
}

/* ---------- Barre d'actions ---------- */
function renderBar(){
  const bar = $('#actionbar');
  if(S.space !== 'seance' || S.closed){ bar.hidden = true; return; }
  bar.hidden = false;
  const t = targets();
  const label = t.explicit
    ? `<strong>${plural(S.sel.size,'poste')} sélectionné${S.sel.size>1?'s':''}</strong><button type="button" id="clearSel">Tout désélectionner</button>`
    : `<strong>Toute la salle</strong><span>· ${t.ok.length + t.pending.length} postes dans la séance</span>`;
  const note = naNote(t);
  bar.innerHTML = `<div class="target">${label}${ref(t.explicit?'SEL-1':'SEL-2')}${note?`<span class="note">${esc(note)} ${ref('SEL-4')}</span>`:''}</div>
    <div class="actions">${ACTIONS.map(a => `<button type="button" class="bbtn" data-a="${a.id}" title="${esc(a.long())} (${a.key})" aria-expanded="${S.pop===a.id}">${ic(a.icon())}${esc(a.label())}</button>`).join('')}
      <button type="button" class="bbtn" data-a="more" aria-expanded="${S.pop==='more'||['web','app'].includes(S.pop)}">${ic('more')}Plus</button>${ref('SEL-3')}</div>
    ${S.pop ? `<div class="pop" role="dialog" aria-label="Action">${popHTML()}</div>` : ''}`;
  const cs = $('#clearSel'); if(cs) cs.onclick = () => { S.sel.clear(); render(); };
  bar.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const id = b.dataset.a;
    if(id==='more'){ togglePop('more'); return; }
    ACTIONS.find(a => a.id===id).run();
  });
  bindPop();
}
function popHTML(){
  const t = targets(), n = t.ok.length + t.pending.length;
  const scope = t.explicit ? plural(n,'poste') : `toute la salle (${n} postes)`;
  switch(S.pop){
    case 'more': return `<h3>Plus d'actions</h3>${MORE.map(m => `<button type="button" class="opt" data-more="${m.id}">${ic(m.icon())}<span>${esc(m.long())}</span></button>`).join('')}${ref('ERGO-3')}`;
    case 'msg': return `<h3>Message à ${esc(scope)}</h3><p class="sub">Il s'affiche au premier plan chez l'élève. ${ref('MSG-2')}</p>
      <div class="chips">${PREDEF.map(m => `<button type="button" data-pre="${esc(m)}">${esc(m)}</button>`).join('')}</div>
      <textarea id="msgText" aria-label="Texte du message" placeholder="Écrire un message…"></textarea>
      <div class="row"><button type="button" class="btn" data-x>Annuler</button><button type="button" class="btn primary" id="msgSend">Envoyer</button></div>`;
    case 'file': return `<h3>Distribuer un fichier à ${esc(scope)}</h3><p class="sub">Il arrive dans le dossier Surveo de l'élève et sera retiré des postes de salle à la fin de la séance. ${ref('DISTRIB-2 DISTRIB-6')}</p>
      ${FILES.map(f => `<button type="button" class="opt" data-file="${esc(f)}">${ic('file')}<span>${esc(f)}<small>Bibliothèque · récemment utilisé</small></span></button>`).join('')}
      <label class="opt" style="cursor:pointer">${ic('plus')}<span>Choisir un autre fichier…</span><input type="file" id="fileIn" class="sr"></label>`;
    case 'tp': return `<h3>Lancer un TP sur ${esc(scope)}</h3><p class="sub">Choisissez dans votre bibliothèque. Pour créer ou modifier un modèle, passez par Préparer. ${ref('PANNEAU-3')}</p>

  const p = P(7), m = tp(), cur = p.step;
  const helpIdx = S.helpQueue.indexOf(7);
  const inExam = S.exam;

  if(p.paused) ov.push(`<div class="overlay pause" role="alert">${ic('pause')}<div class="big">Écran mis en pause par ${TEACHER}.</div><div>Votre travail est conservé tel quel. ${ref('ECRAN-2 ECRAN-4')}</div></div>`);

  else if(pollFg) ov.push(`<div class="overlay fg"><div class="fgcard" role="dialog" aria-labelledby="spT"><h3 id="spT">Sondage de ${TEACHER} ${ref('SONDAGE-2')}</h3><p style="margin:0">${esc(S.poll.q)}</p>${S.poll.opts.map((o,i) => `<button type="button" class="opt" data-ans="${i}">${esc(o)}</button>`).join('')}</div></div>`);
  const showRes = S.poll && S.poll.shown;
  st.innerHTML = `
    <div class="desk-area">

      ${S.broadcast ? `<div class="castwin"><header>${ic('cast','sm')}${TEACHER} partage son écran ${ref('DIFF-2 DIFF-6')}</header>${screen({app:'pt'})}</div>` : ''}
      <div class="indic ${inExam?'exam':''}"><span class="live" aria-hidden="true"></span><span>${inExam ? `<b>Examen</b> jusqu'à ${fmt(S.end)}` : `Séance de ${TEACHER} jusqu'à ${fmt(S.end)}`}</span>${ref('REJ-4 AGENT-2')}<button type="button" class="btn" id="spToggle" aria-expanded="${S.student.panel}">Surveo</button></div>
      ${S.student.panel ? `<aside class="spanel" aria-label="Panneau élève">

        <div class="sb">
          <section><h4>TP « ${esc(m.title)} »</h4>
            ${m.steps.map((s,i) => `<label class="sstep ${i===cur?'cur':''}"><input type="checkbox" data-step="${i}" ${i<cur?'checked':''}><span>${esc(s.o)}${i===cur?`<br><span class="note">Temps indicatif restant : ${Math.max(1,s.d-14)} min</span>`:''}</span></label>`).join('')}
            ${m.steps[cur] && m.steps[cur].c ? `<div class="consigne">${esc(m.steps[cur].c)}</div>` : ''}
            <p class="note" style="margin:6px 0 0">Vous cochez vous-même les étapes terminées. ${ref('TP-6')}</p></section>
          <section><h4>Rendre mon travail · ${S.student.rendus.length + p.rendus}/${m.rendus}</h4>
            <div class="drop">Glissez un fichier ici<button type="button" class="btn" id="srendu">Choisir un fichier</button></div>
            ${S.student.rendus.map(r => `<div class="ack">${ic('check','sm')}« ${esc(r.name)} » ${r.ok ? `reçu par l'enseignant à ${r.t}` : 'en attente d’envoi'}</div>`).join('')}${S.student.rendus.length?ref('RENDU-2'):''}</section>
          ${S.student.files.length ? `<section><h4>Fichiers reçus</h4>${S.student.files.map(f => `<div class="opt" style="cursor:default">${ic('file')}<span>${esc(f)}<small>Retiré de ce poste à la fin de la séance</small></span></div>`).join('')}${ref('DISTRIB-3 DISTRIB-8')}</section>` : ''}
          ${showRes ? `<section><h4>Résultats du sondage</h4><b>${esc(S.poll.q)}</b><div class="pollbar" style="margin-top:6px">${S.poll.opts.map((o,i) => { const tot = S.poll.votes.reduce((a,b)=>a+b,0); return `<span>${esc(o)}</span><span class="mono">${S.poll.votes[i]}</span><span class="track"><span class="fill" style="display:block;width:${tot?S.poll.votes[i]/tot*100:0}%"></span></span>`; }).join('')}</div><p class="note" style="margin:6px 0 0">Résultats de la classe, sans aucun nom. ${ref('SONDAGE-5')}</p></section>` : ''}

              : S.student.helpTaken ? `<p style="margin:0 0 6px" class="ack">${ic('check','sm')}${TEACHER} a pris en compte votre demande.</p><button type="button" class="btn" id="helpAsk">${ic('hand','sm')}Demander de l'aide</button>`

        </div></aside>` : ''}
      ${ov.join('')}

    <div class="taskbar"><span>Applications</span><span>LibreOffice Writer</span><span>Packet Tracer</span><span class="clk">${fmt(S.now)}</span></div>`;

  const sc = $('#spClose'); if(sc) sc.onclick = () => { S.student.panel = false; renderStudent(); };
  st.querySelectorAll('[data-step]').forEach(cb => cb.onchange = () => { const i = +cb.dataset.step; p.step = cb.checked ? Math.min(i+1, m.steps.length-1) : i; p.late = false; renderStudent(); });

  const ha = $('#helpAsk'); if(ha) ha.onclick = () => { if(!S.helpQueue.includes(7)) S.helpQueue.push(7); S.student.helpTaken = false; renderStudent(); };
  const hc = $('#helpCancel'); if(hc) hc.onclick = () => { S.helpQueue = S.helpQueue.filter(x => x!==7); renderStudent(); };
  const so = $('#smOk'); if(so) so.onclick = () => { S.student.msg = null; renderStudent(); };
  st.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => { S.poll.votes[+b.dataset.ans]++; S.poll.answered.add(7); S.student.pollAnswered = true; renderStudent(); });
  const sf = $('#sconv'); if(sf) sf.onsubmit = e => { e.preventDefault(); const v = $('#sconvIn').value.trim(); if(!v) return; (S.convs[7] = S.convs[7]||[]).push({me:false,t:fmt(S.now),x:v}); S.unread.add(7); renderStudent(); };
}

  it.push({t:'Aller à Séance', g:'Espace', i:'room', run:() => { S.space='seance'; render(); }});
  if(S.roles.tech || S.roles.etab) it.push({t:'Aller à Administrer', g:'Espace', i:'gear', run:() => { S.space='admin'; render(); }});
  it.push({t:'Prolonger la séance de 15 min', g:'Séance', i:'clock', run:() => { S.end += 15; render(); toast(`Séance prolongée jusqu'à ${fmt(S.end)}`); }});
  it.push({t:'Clôturer la séance', g:'Séance', i:'x', run:clotureSeance});
  placed().filter(p => p.state==='in').forEach(p => it.push({t:`Poste ${p.label} · ${p.names.join(', ')||'sans nom'}`, g:'Poste', i:'target', run:() => { S.space='seance'; S.sel = new Set([p.id]); render(); }}));
  return it;
}
function openPalette(){
  const layer = $('#layer');
  layer.innerHTML = `<div class="backdrop" data-close><div class="palette" role="dialog" aria-modal="true" aria-label="Rechercher une action"><input id="palIn" placeholder="Tapez une action ou un poste : pause, distribuer, 07…" autocomplete="off" role="combobox" aria-controls="palList" aria-expanded="true"><ul id="palList" role="listbox"></ul></div></div>`;
  const inp = $('#palIn'), ul = $('#palList'); let idx = 0, cur = [];
  const draw = () => {
    const q = norm(inp.value.trim());
    cur = palItems().filter(x => !q || norm(x.t).includes(q) || norm(x.g).includes(q)).slice(0, 12);
    idx = Math.min(idx, Math.max(0, cur.length-1));
    ul.innerHTML = cur.length ? cur.map((x,i) => `<li role="option" data-i="${i}" aria-selected="${i===idx}">${ic(x.i,'sm')}${esc(x.t)}<span class="grp">${x.g}</span></li>`).join('') : `<li class="empty" aria-disabled="true">Aucune action ne correspond.</li>`;
    ul.querySelectorAll('[data-i]').forEach(li => li.onclick = () => go(+li.dataset.i));
  };
  const close = () => { layer.innerHTML = ''; };
  const go = i => { const x = cur[i]; close(); if(x) x.run(); };
  inp.addEventListener('input', () => { idx = 0; draw(); });
  inp.addEventListener('keydown', e => {
    if(e.key==='ArrowDown'){ e.preventDefault(); idx = Math.min(idx+1, cur.length-1); draw(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); idx = Math.max(idx-1, 0); draw(); }
    else if(e.key==='Enter'){ e.preventDefault(); go(idx); }
    else if(e.key==='Escape'){ close(); }
  });
  layer.querySelector('[data-close]').addEventListener('click', e => { if(e.target.hasAttribute('data-close')) close(); });
  draw(); inp.focus();
}

/* ---------- Rendu global et clavier ---------- */
function render(){
  document.documentElement.classList.toggle('show-refs', $('#showRefs').checked);
  $('#app').hidden = S.studentView;
  $('#toStudent').textContent = S.studentView ? 'Revenir à la console' : 'Voir le poste 07 côté élève';
  if(!S.studentView){ renderTop(); renderBanners(); renderMain(); renderBar(); }
  renderStudent();
}
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); if(!S.studentView) openPalette(); return; }
  if(e.key==='Escape'){
    if($('#layer').innerHTML){ $('#layer').innerHTML=''; return; }
    if(S.pop){ S.pop=null; render(); return; }
    if(S.focus){ S.focus=null; render(); return; }
    if(S.sel.size){ S.sel.clear(); render(); }
    return;
  }
  if(typing || S.studentView || S.space!=='seance' || S.closed) return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a'){ e.preventDefault(); S.sel = new Set(placed().filter(p => p.state==='in'||p.state==='lost').map(p => p.id)); render(); return; }
  if(e.altKey){
    const map = {p:'pause', m:'msg', f:'file', t:'tp', s:'poll'};
    const a = map[e.key.toLowerCase()];
    if(a){ e.preventDefault(); ACTIONS.find(x => x.id===a).run(); }
  }
});

/* ---------- Barre de la maquette ---------- */
$('#roleTech').onchange = e => { S.roles.tech = e.target.checked; render(); };
$('#roleEtab').onchange = e => { S.roles.etab = e.target.checked; render(); };
$('#showRefs').onchange = () => render();
$('#toStudent').onclick = () => { S.studentView = !S.studentView; S.pop = null; render(); };
$('#simHelp').onclick = () => {
  const c = placed().filter(p => p.state==='in' && !S.helpQueue.includes(p.id));
  if(!c.length) return; const p = c[Math.floor(Math.random()*c.length)];
  S.helpQueue.push(p.id); render(); if(!S.studentView) toast(`Poste ${p.label} demande de l'aide`, `Rang ${S.helpQueue.length} dans la file`, null, 'AIDE-1');
};
$('#simAlert').onclick = () => {
  S.alerts.push({poste:'12', level:'élevé', motif:'propos potentiellement violents', t:fmt(S.now), seen:false});
  render();
};
$('#simLost').onclick = () => {
  const p = P(9); p.state = p.state==='lost' ? 'in' : 'lost'; render();
  if(!S.studentView) toast(p.state==='lost' ? 'Poste 09 : connexion perdue' : 'Poste 09 a rejoint la séance', p.state==='lost' ? 'Ses restrictions restent actives jusqu’à la fin de la séance ; les actions l’attendront.' : 'Il s’est resynchronisé sans action de votre part.', null, 'RESTR-2');
};

render();
})();
</script>
